name: Build & Release Openfy Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Configure Keystore Signature
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from repository secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/openfy-release.jks
          else
            echo "Using persistent Openfy release keystore (ensures seamless app updates across builds)..."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Openfy.apk

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v$(grep -m 1 'versionName =' app/build.gradle.kts | cut -d '"' -f2)"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Openfy-${RELEASE_TAG}.apk"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          echo "Computing SHA256 hashes..."
          cd release-artifacts
          sha256sum Openfy.apk > SHA256SUMS.txt
          sha256sum "Openfy-${RELEASE_TAG}.apk" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openfy-Android-APK
          path: release-artifacts/Openfy.apk
          retention-days: 30

      - name: Publish Versioned and Rolling Releases
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          APK_SHA=$(sha256sum release-artifacts/Openfy.apk | awk '{print $1}')

          echo "Target tag: ${TAG}"
          echo "Ref: ${{ github.ref }}"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Publishing permanent versioned release for ${TAG}..."

            RELEASE_NOTES="### 🎵 Openfy Android ${TAG}

**Openfy** is a pure native Android streaming client bringing Spotify's sleek interface together with RVX YouTube Music's high-fidelity, ad-free streaming engine.

---

### 🚀 What's New
* **Spotify Library Sync**: Fast 1-click \`sp_dc\` cookie input to sync your Liked Songs and playlists.
* **Playlist Management & Direct Heart**: Dedicated Add-to-Playlist sheet, '+ New Playlist' creation dialog, and instant Spotify API library write (\`PUT /v1/me/tracks\`).
* **LRCLIB Real-time Lyrics**: Fullscreen synced karaoke lyrics with line-by-line autoscroll and tap-to-seek.
* **Desktop Google Login Flow**: Seamless Google Sign-In WebView detection bypass.

### 🛠️ Bug Fixes & Stability
* **Playback Buffer & Wake Lock**: Fixed the 50-second background playback pause using \`WAKE_MODE_NETWORK\`, 3-minute ExoPlayer buffering, and persistent foreground service.
* **Cipher Solving**: Integrated InnerTube STS cipher decryption for unthrottled streams.

### 🔒 Verification & Hashes
* **File**: \`Openfy-${TAG}.apk\` / \`Openfy.apk\`
* **SHA-256**: \`${APK_SHA}\`
* **Persistent Keystore Signature**: In-place updates supported across all releases without uninstalling!

#### 📥 Download:
Download **\`Openfy.apk\`** or **\`Openfy-${TAG}.apk\`** below to install directly on your Android device."

            gh release create "${TAG}" \
              release-artifacts/Openfy.apk \
              "release-artifacts/Openfy-${TAG}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --title "Openfy ${TAG} - Spotify UI with RVX Audio Engine" \
              --notes "${RELEASE_NOTES}" || gh release upload "${TAG}" release-artifacts/* --clobber
          fi

          echo "Updating rolling 'latest' release for direct download links..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

          gh release delete latest --yes || true

          gh release create latest \
            release-artifacts/Openfy.apk \
            release-artifacts/SHA256SUMS.txt \
            --title "Openfy Latest Release (Auto-Build)" \
            --notes "### 🎵 Openfy Android - Latest Release (${TAG})

This rolling release points to the newest stable build.

* **Version:** \`${TAG}\`
* **Commit:** \`${{ github.sha }}\`
* **SHA-256:** \`${APK_SHA}\`
* **Persistent Signature:** Signed with the official Openfy release key. Direct updates over previous versions are supported without uninstalling!

#### 📥 Direct Download:
Download **\`Openfy.apk\`** below." \
            --target ${{ github.sha }} \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
