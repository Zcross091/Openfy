name: Build & Release Openfy Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Configure Keystore Signature
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from repository secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/openfy-release.jks
          else
            echo "Using persistent Openfy release keystore (ensures seamless app updates across builds)..."
          fi

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/Openfy.apk

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="v$(grep -m 1 'versionName =' app/build.gradle.kts | cut -d '"' -f2)"
          fi

          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/Openfy-${RELEASE_TAG}.apk"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

          echo "Computing SHA256 hashes..."
          cd release-artifacts
          sha256sum Openfy.apk > SHA256SUMS.txt
          sha256sum "Openfy-${RELEASE_TAG}.apk" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Openfy-Android-APK
          path: release-artifacts/Openfy.apk
          retention-days: 30

      - name: Publish Versioned and Rolling Releases
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          APK_SHA=$(sha256sum release-artifacts/Openfy.apk | awk '{print $1}')
          echo "Target tag: ${TAG}"
          echo "Ref: ${{ github.ref }}"

          echo "Managing versioned release ${TAG}..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG} notes and assets..."
            gh release edit "${TAG}" --title "Openfy ${TAG} - Spotify UI with RVX Audio Engine" --notes-file .github/release_notes.md
            gh release upload "${TAG}" release-artifacts/* --clobber
          else
            echo "Creating new versioned release ${TAG}..."
            gh release create "${TAG}" \
              release-artifacts/Openfy.apk \
              "release-artifacts/Openfy-${TAG}.apk" \
              release-artifacts/SHA256SUMS.txt \
              --title "Openfy ${TAG} - Spotify UI with RVX Audio Engine" \
              --notes-file .github/release_notes.md
          fi

          echo "Updating rolling 'latest' release for direct download links..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest || true

          printf "### 🎵 Openfy Android - Latest Release (%s)\n\nThis rolling release points to the newest stable build.\n\n* **Version:** \`%s\`\n* **Commit:** \`%s\`\n* **SHA-256:** \`%s\`\n* **Persistent Signature:** Signed with the official Openfy release key. Direct updates over previous versions are supported without uninstalling!\n\n#### 📥 Direct Download:\nDownload **\`Openfy.apk\`** below.\n" "${TAG}" "${TAG}" "${{ github.sha }}" "${APK_SHA}" > release_notes_latest.txt

          if gh release view "latest" >/dev/null 2>&1; then
            echo "Release 'latest' exists. Uploading Android APK with --clobber..."
            gh release upload latest \
              release-artifacts/Openfy.apk \
              release-artifacts/SHA256SUMS.txt \
              --clobber
          else
            echo "Creating rolling 'latest' release with Android APK..."
            gh release create latest \
              release-artifacts/Openfy.apk \
              release-artifacts/SHA256SUMS.txt \
              --title "Openfy Latest Release (Auto-Build)" \
              --notes-file release_notes_latest.txt \
              --target ${{ github.sha }} \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
